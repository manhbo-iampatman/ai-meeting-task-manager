<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef3fd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070b17" media="(prefers-color-scheme: dark)" />
    <title>MeetFlow</title>
    <!-- Đặt chế độ sáng / tối NGAY, trước khi React chạy → không bị chớp trắng khi mở trang ở chế độ tối -->
    <script>
      try {
        var t = localStorage.getItem('meetflow-theme')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
